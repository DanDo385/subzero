<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Subzero</title>
  <style>
    body { font-family: system-ui, sans-serif; font-size: 13px; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
    .tabs { display: flex; border-bottom: 1px solid #e0e0e0; padding: 0 12px; background: #fafafa; }
    .tab { padding: 10px 14px; cursor: pointer; border: none; background: none; font-size: 13px; color: #666; border-bottom: 2px solid transparent; }
    .tab.active { color: #5b3f87; border-bottom-color: #5b3f87; font-weight: 600; }
    .tab-content { flex: 1; overflow-y: auto; padding: 12px; }
    .tab-content.hidden { display: none; }
    h2 { margin: 0 0 8px; font-size: 14px; }
    #handoff { white-space: pre-wrap; background: #f5f5f5; padding: 10px; border-radius: 6px; max-height: 50vh; overflow-y: auto; font-size: 12px; }
    button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .insert-btn { margin-top: 8px; background: #5b3f87; color: white; }
    .loading { color: #666; font-style: italic; }
    .error { color: #d32f2f; }
    .session-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .session-input-row input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: monospace; }
    .session-input-row button { background: #5b3f87; color: white; white-space: nowrap; }
    .messages { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .message { padding: 10px; border-radius: 8px; max-width: 90%; font-size: 12px; line-height: 1.5; white-space: pre-wrap; }
    .message.user { align-self: flex-end; background: #5b3f87; color: white; }
    .message.assistant { align-self: flex-start; background: #f0f0f0; color: #333; }
    .message.system { align-self: center; background: #fff3e0; color: #888; font-size: 11px; padding: 4px 10px; }
    .message .meta { font-size: 10px; opacity: 0.7; margin-bottom: 4px; }
    .reply-row { display: flex; gap: 8px; margin-top: auto; }
    .reply-row input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .reply-row button { background: #5b3f87; color: white; }
    .reply-row button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-bar { font-size: 11px; color: #888; padding: 6px 0; text-align: center; }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" data-tab="handoff">Handoff</button>
    <button class="tab" data-tab="bridge">Bridge</button>
  </div>

  <!-- Handoff tab -->
  <div id="handoffTab" class="tab-content">
    <h2>Project Handoff</h2>
    <div id="handoff" class="loading">Loading...</div>
    <button id="insertBtn" class="insert-btn">Copy to Clipboard</button>
  </div>

  <!-- Bridge tab -->
  <div id="bridgeTab" class="tab-content hidden">
    <h2>Session Bridge</h2>
    <p style="color: #666; font-size: 12px; margin: 0 0 8px;">
      Paste a session link or code from your CLI to view and reply.
    </p>
    <div class="session-input-row">
      <input id="sessionIdInput" type="text" placeholder="Session code or link..." autocomplete="off">
      <button id="connectBtn">Connect</button>
    </div>
    <div id="bridgeStatus" class="status-bar"></div>
    <div id="bridgeMessages" class="messages"></div>
    <div id="replyRow" class="reply-row hidden">
      <input id="replyInput" type="text" placeholder="Type a reply..." autocomplete="off">
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
