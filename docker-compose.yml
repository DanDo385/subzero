# Local development stack: Postgres with pgvector, plus the MCP server.
#
# This is NOT the production topology. In production, Postgres and object
# storage are Supabase, and the server runs on Vercel. See docs/guides/.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subzero
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subzero"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUBZERO_ENVIRONMENT: dev
      SUBZERO_BASE_URL: http://localhost:8080
      SUBZERO_DATABASE_URL: postgresql://postgres:postgres@db:5432/subzero
      # Development auth. Refused outright when SUBZERO_ENVIRONMENT=prod.
      SUBZERO_AUTH_MODE: static
      SUBZERO_STATIC_TOKENS: '{"dev-token-change-me":"you@example.com"}'
      SUBZERO_ALLOWED_SUBJECTS: you@example.com
      SUBZERO_STORAGE_BACKEND: local
      SUBZERO_LOCAL_STORAGE_ROOT: /data/storage
      SUBZERO_CLASSIFIER: ${SUBZERO_CLASSIFIER:-rules}
      SUBZERO_TYPESAFE_API_KEY: ${SUBZERO_TYPESAFE_API_KEY:-}
      SUBZERO_WORKER_API_KEY: dev-worker-key
      SUBZERO_OAUTH_SIGNING_KEY: dev-signing-key
    ports:
      - "8080:8080"
    volumes:
      - storage:/data/storage
    # Default command is `subzero serve`. The entrypoint migrates
    # only in that case.

volumes:
  pgdata:
  storage:
