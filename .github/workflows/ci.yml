name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: subzero_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d subzero_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUBZERO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/subzero_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest
